<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Information</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #089ca3 30%, #068f21 80%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Italics, sans-serif;
    }
    
    .weather-container {
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.995);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    
    .search-box {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #8c6f6fcb;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .search-box input:focus {
      border-color: #01a224;
    }
    
    .search-box button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #16c138 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(4, 149, 4, 0.3);
    }
    
    .weather-info {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .location {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    
    .current-temp {
      font-size: 64px;
      font-weight: 700;
      color: #667eea;
      margin: 15px 0;
    }
    
    .weather-desc {
      font-size: 18px;
      color: #666;
      text-transform: capitalize;
      margin-bottom: 15px;
    }
    
    .weather-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }
    
    .detail-item {
      padding: 12px;
      background: #f5f7fa;
      border-radius: 10px;
    }
    
    .detail-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    
    .detail-value {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    
    .forecast {
      margin-top: 30px;
    }
    
    .forecast-title {
      font-size: 32px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .forecast-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .forecast-card {
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      text-align: center;
    }
    
    .forecast-date {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    
    .forecast-temp {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
    }
    
    .forecast-desc {
      font-size: 12px;
      color: #880a0a;
      margin-top: 5px;
    }
    
    .error {
      color: #d3d3d3;
      text-align: center;
      padding: 20px;
      background: #620101;
      border-radius: 10px;
    }
    
    .loading {
      text-align: center;
      color: #30c36d00;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="weather-container">
    <h1 style="text-align: center; color: #c8c8c8; margin-top: 0;">Weather Forecast</h1>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." value="Johannesburg">
      <button id="searchBtn">See Results</button>
    </div>
    
    <div id="weatherOutput"></div>
  </div>
  
  <script src="indeed.js"></script>
</body>
</html>
